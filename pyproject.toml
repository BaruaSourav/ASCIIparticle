[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asciiparticle"
version = "0.1.0"
description = "ASCII particle & sprite game engine for the macOS terminal"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
video = ["pillow>=9.1"]

[project.scripts]
asciiparticle = "asciiparticle.__main__:main"

[tool.setuptools]
packages = ["asciiparticle", "asciiparticle.scenes"]
